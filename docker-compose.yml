services:
  web:
    build: .

    container_name: plantae

    restart: always

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./media:/app/media
      - ./static:/app/static

  # Background worker for escalations (Slack/email notifications, resuming the
  # escalation graph after staff decide, SLA reminders). Same image as web.
  worker:
    build: .

    container_name: plantae-worker

    restart: always

    # Wait until the web container has applied migrations (the task queue lives in
    # the database), then start the worker.
    command: sh -c "until python manage.py migrate --check >/dev/null 2>&1; do echo 'worker: waiting for migrations'; sleep 5; done; exec python manage.py qcluster"

    env_file:
      - .env

    depends_on:
      - web

    volumes:
      - ./media:/app/media
